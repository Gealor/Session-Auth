[project]
name = "session-auth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.0",
    "alembic>=1.18.4",
    "apscheduler>=3.11.2",
    "asgiref>=3.11.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "cffi>=2.0.0",
    "cryptography>=46.0.6",
    "fastapi>=0.135.2",
    "jinja2>=3.1.6",
    "psycopg>=3.3.3",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.12.5",
    "python-dateutil>=2.9.0.post0",
    "redis>=7.4.0",
    "ruff>=0.15.12",
    "sqlalchemy>=2.0.48",
    "taskiq>=0.12.4",
    "taskiq-aio-pika>=0.6.0",
    "taskiq-fastapi>=0.5.0",
    "taskiq-redis>=1.2.2",

    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "testcontainers>=4.15.0",
]

[tool.ruff]
line-length = 100
extend-exclude = [
    "src/alembic/versions",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
log_cli = true
log_cli_level = "INFO"
addopts = "-p no:warnings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
